<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Bookmark Organizer</title>
    <style>
      :root {
        --bg-init: #0b0e14;
        --card-init: #151b26;
        --border-init: rgba(130, 149, 184, 0.2);
        --text-sub: #8295b8;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-init: #f8fafc;
          --card-init: #ffffff;
          --border-init: rgba(130, 149, 184, 0.25);
          --text-sub: #64748b;
        }
      }
      body {
        margin: 0;
        background: var(--bg-init);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .init-skeleton-header {
        text-align: center;
        padding: 2.5rem 1rem 1.25rem;
      }
      .init-skeleton-title {
        font-size: 1.85rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #7c94ba, #506990);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0;
      }
      .init-skeleton-card {
        margin: 0 1.25rem 1rem;
        padding: 1.25rem;
        background: var(--card-init);
        border: 1px solid var(--border-init);
        border-radius: 12px;
        min-height: 80px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="init-skeleton-header">
        <h1 class="init-skeleton-title">AI Bookmark Organizer</h1>
        <p style="font-size: 0.88rem; color: var(--text-sub); margin-top: 0.35rem;">Transform your chaos into a curated library</p>
      </div>
      <div class="init-skeleton-card" style="height: 90px;"></div>
      <div class="init-skeleton-card" style="height: 140px;"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
